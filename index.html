
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Interactive Website</h1>

        <button id="themeBtn">🌙 Dark Mode</button>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home" class="card">
            <h2>Welcome!</h2>
            <p id="message">
                Welcome! Click the button to get started.
            </p>

            <button id="messageBtn">Click Me!</button>
        </section>

        <section id="about" class="card">
            <h2>Interactive Counter</h2>

            <p>Count: <span id="count">0</span></p>

            <button id="addBtn">Add +1</button>
            <button id="resetBtn">Reset</button>
        </section>

        <section id="contact" class="card">
            <h2>Contact Me</h2>

            <form id="contactForm">
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <button type="submit">Submit</button>
            </form>

            <p id="formMessage"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Interactive Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
